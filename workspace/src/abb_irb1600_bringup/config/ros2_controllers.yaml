# Same controllers for the simulation (mock_components) and the real robot driver.
controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    # Minimal contract with the hardware: joint positions in, joint positions out
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 100.0
    action_monitor_rate: 50.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      joint_1: {trajectory: 0.1, goal: 0.01}
      joint_2: {trajectory: 0.1, goal: 0.01}
      joint_3: {trajectory: 0.1, goal: 0.01}
      joint_4: {trajectory: 0.1, goal: 0.01}
      joint_5: {trajectory: 0.1, goal: 0.01}
      joint_6: {trajectory: 0.1, goal: 0.01}
