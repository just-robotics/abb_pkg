services:
  abb:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    image: abb
    network_mode: host
    ipc: host
    privileged: true

    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, compute, utility]

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /dev:/dev:rw
      - ../workspace/src:/workspace/src:rw

    environment:
      - ROS_LOCALHOST_ONLY=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

    working_dir: /workspace
    
    tty: true
    stdin_open: true
    entrypoint: []

    healthcheck:
      test: ["CMD", "ros2", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
